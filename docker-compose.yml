services:
  mysql:
    image: mysql:8.0
    container_name: leart_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: leart_db
      MYSQL_USER: leart
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$MYSQL_PASSWORD" mysqladmin ping -h localhost -u leart --silent'
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/Leart.Api
      dockerfile: Dockerfile
    container_name: leart_backend
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=leart_db;User=leart;Password=${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD};AllowUserVariables=True;CharSet=utf8mb4;
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Secret=${JWT_SECRET:?Configure JWT_SECRET}
      - Jwt__Issuer=LeartApi
      - Jwt__Audience=LeartApp
      - BootstrapAdmin__Username=${BOOTSTRAP_ADMIN_USERNAME:-}
      - BootstrapAdmin__Email=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BootstrapAdmin__Password=${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - uploads_data:/app/wwwroot/uploads
      - private_data:/app/storage
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: leart_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
  private_data:
