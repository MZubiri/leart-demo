server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 25M;

  # DNS resolver de Docker. Permite que Nginx inicie sin crashear si el backend aún no está listo.
  resolver 127.0.0.11 8.8.8.8 valid=10s ipv6=off;
  resolver_timeout 5s;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    set $backend_api http://backend:5000;
    proxy_pass $backend_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection keep-alive;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    set $backend_uploads http://backend:5000;
    proxy_pass $backend_uploads$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
