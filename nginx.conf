server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 25M;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript image/svg+xml;

  # DNS resolver de Docker. Permite que Nginx inicie sin crashear si el backend aún no está listo.
  resolver 127.0.0.11 8.8.8.8 valid=10s ipv6=off;
  resolver_timeout 5s;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ^~ /health/ {
    set $backend_health http://backend:5000;
    proxy_pass $backend_health$request_uri;
    add_header Cache-Control "no-store";
  }

  location ^~ /api/ {
    set $backend_api http://backend:5000;
    proxy_pass $backend_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection keep-alive;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /uploads/orders/ { return 404; }
  location ^~ /private/ { return 404; }

  location ^~ /uploads/ {
    set $backend_uploads http://backend:5000;
    proxy_pass $backend_uploads$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ^~ /optimized/ {
    expires 365d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* "-[a-z0-9]{8,}\.(?:js|css)$" {
    expires 365d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    expires 1d;
    add_header Cache-Control "public, must-revalidate";
    try_files $uri =404;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
